<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Leadership Election Ballot</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for a cleaner interface */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f9; /* Light background */
        }
        .candidate-card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: 2px solid transparent;
            min-height: 120px;
        }
        /* Style for the selected card */
        .candidate-card.selected {
            border-color: #2563eb; /* Blue border */
            background-color: #eff6ff; /* Light blue background */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px);
        }
        /* Hide the default radio button visually */
        input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10 p-6 bg-white rounded-xl shadow-lg">
            <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight">Official Gps Candidate</h1>
            <p class="text-lg text-gray-500 mt-2">Select one candidate for each of the  positions below.</p>
        </header>

        <!-- Ballot Container -->
        <main id="ballot-container" class="space-y-8">
            <!-- Positions will be rendered here by JavaScript -->
        </main>

        <!-- Submission Section -->
        <div class="mt-12 p-6 bg-white rounded-xl shadow-lg border-t-4 border-blue-500">
            <div id="status-message" class="text-center mb-4 text-lg text-red-600 font-semibold hidden">
                Please select a candidate for all 12 positions before submitting.
            </div>
            <button id="submit-button" onclick="castVote()"
                class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-indigo-700 transition duration-150 ease-in-out disabled:opacity-50"
                disabled>
                Cast My Vote
            </button>

            <!-- Custom Alert/Confirmation Modal -->
            <div id="confirmation-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 hidden items-center justify-center p-4 z-50">
                <div class="bg-white p-6 md:p-8 rounded-xl shadow-2xl max-w-sm w-full text-center transform scale-95 transition-transform duration-300">
                    <svg class="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">Vote Cast Successfully!</h3>
                    <p class="text-gray-600 mb-6">Thank you for participating in the election process. Your selections have been recorded.</p>
                    <button onclick="document.getElementById('confirmation-modal').classList.add('hidden')"
                        class="bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition">
                        Close
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Data structure for the election: 12 positions, 3 candidates each.
        const ELECTION_DATA = [
            { position: "coordinator", candidates: ["First candidate", "second candidate", "third candidate"] },
            { position: "Vice coordinator", candidates:  ["First candidate", "second candidate", "third candidate"] },
            { position: "Secretary coordinator", candidates: ["First candidate", "second candidate", "third candidate"] },
            { position: "finace coordinator", candidates: ["First candidate", "second candidate", "third candidate"]},
            { position: "media coordinator", candidates:  ["First candidate", "second candidate", "third candidate"] },
            { position: "social Coordinator", candidates: ["First candidate", "second candidate", "third candidate"] },
            { position: "men hostel coordinator", candidates:  ["First candidate", "second candidate", "third candidate"] },
            { position: "women hostel coordinator", candidates: ["First candidate", "second candidate", "third candidate"] },
            { position: "coca coordinator", candidates: ["First candidate", "second candidate", "third candidate"]] },
            { position: "Ikut coordinator", candidates:  ["First candidate", "second candidate", "third candidate"] },
            { position: "Inyara coordinator", candidates:  ["First candidate", "second candidate", "third candidate"] },
            { position: "other coordinator", candidates:  ["First candidate", "second candidate", "third candidate"] }
        ];

        // State to track the user's current selections
        let currentVotes = {};

        // Helper function to create candidate cards
        function createCandidateCard(positionIndex, candidateName, candidateIndex) {
            const positionId = ELECTION_DATA[positionIndex].position.replace(/\s/g, '-');
            const candidateId = `${positionId}-${candidateIndex}`;

            // Create the main label container (which acts as the clickable card)
            const label = document.createElement('label');
            label.className = "candidate-card flex items-center p-4 bg-gray-50 rounded-xl shadow-sm hover:shadow-md border-2 border-transparent transition cursor-pointer";
            label.htmlFor = candidateId;
            label.onclick = () => selectCandidate(positionId, candidateName, label);

            // Hidden radio input
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = positionId; // Grouped by position
            input.id = candidateId;
            input.value = candidateName;

            // Display elements
            const initials = candidateName.split(' ').map(n => n[0]).join('');
            const initialIcon = document.createElement('div');
            initialIcon.className = 'w-10 h-10 flex items-center justify-center bg-blue-500 text-white font-bold rounded-full mr-4 text-lg shrink-0';
            initialIcon.textContent = initials;

            const nameText = document.createElement('span');
            nameText.className = 'text-gray-800 font-semibold truncate';
            nameText.textContent = candidateName;

            // Checkmark icon (for selected state)
            const checkIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            checkIcon.setAttribute('class', 'w-6 h-6 ml-auto text-blue-500 hidden selection-indicator');
            checkIcon.setAttribute('fill', 'none');
            checkIcon.setAttribute('stroke', 'currentColor');
            checkIcon.setAttribute('viewBox', '0 0 24 24');
            checkIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';


            label.appendChild(input);
            label.appendChild(initialIcon);
            label.appendChild(nameText);
            label.appendChild(checkIcon);

            return label;
        }

        // Handles candidate selection and updates the UI/state
        function selectCandidate(positionId, candidateName, selectedCard) {
            currentVotes[positionId] = candidateName;

            // Deselect all cards for this position
            const container = selectedCard.closest('.position-group');
            if (container) {
                container.querySelectorAll('.candidate-card').forEach(card => {
                    card.classList.remove('selected');
                    card.querySelector('.selection-indicator').classList.add('hidden');
                });
            }

            // Select the clicked card
            selectedCard.classList.add('selected');
            selectedCard.querySelector('.selection-indicator').classList.remove('hidden');

            checkSubmissionStatus();
        }

        // Checks if all positions have a vote and enables/disables the submit button
        function checkSubmissionStatus() {
            const numPositions = ELECTION_DATA.length;
            const numVotes = Object.keys(currentVotes).length;
            const submitButton = document.getElementById('submit-button');

            if (numVotes === numPositions) {
                submitButton.disabled = false;
                document.getElementById('status-message').classList.add('hidden');
            } else {
                submitButton.disabled = true;
            }
        }

        // Renders the entire ballot page
        function renderBallot() {
            const ballotContainer = document.getElementById('ballot-container');
            ELECTION_DATA.forEach((data, pIndex) => {
                const positionId = data.position.replace(/\s/g, '-');

                // Position Section Container
                const section = document.createElement('section');
                section.className = 'position-group bg-white p-5 rounded-xl shadow-md';
                section.id = `group-${positionId}`;

                // Position Title
                const title = document.createElement('h2');
                title.className = 'text-2xl font-bold text-gray-700 mb-4 border-b pb-2 border-indigo-100';
                title.textContent = data.position;

                // Candidates Grid
                const candidatesGrid = document.createElement('div');
                candidatesGrid.className = 'grid grid-cols-1 md:grid-cols-3 gap-4';

                data.candidates.forEach((candidate, cIndex) => {
                    const card = createCandidateCard(pIndex, candidate, cIndex);
                    candidatesGrid.appendChild(card);
                });

                section.appendChild(title);
                section.appendChild(candidatesGrid);
                ballotContainer.appendChild(section);
            });
        }

        // Function called when the user clicks 'Cast My Vote'
        function castVote() {
            const numPositions = ELECTION_DATA.length;
            const numVotes = Object.keys(currentVotes).length;
            const statusMessage = document.getElementById('status-message');

            if (numVotes < numPositions) {
                statusMessage.classList.remove('hidden');
                // Scroll to the top to see the error message
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // 1. Show the final confirmation modal
            document.getElementById('confirmation-modal').classList.remove('hidden');

            // 2. Log the final result to the console (in a real app, this data would be sent to a server)
            console.log("--- FINAL VOTE SUBMISSION ---");
            console.log(JSON.stringify(currentVotes, null, 2));

            // Optional: Visually disable the entire form after submission (for a real scenario)
            document.getElementById('submit-button').disabled = true;
            document.getElementById('submit-button').textContent = 'VOTE SUBMITTED';
            document.querySelectorAll('.candidate-card').forEach(card => card.classList.add('opacity-70', 'pointer-events-none'));
        }

        // Initial setup
        window.onload = () => {
            renderBallot();
            checkSubmissionStatus(); // Check on load (it will be disabled initially)
        };
    </script>
</body>
</html>
